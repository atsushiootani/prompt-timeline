<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>__TITLE__</title>
<style>__CSS__</style>
</head>
<body>
<div class="pt-wrap">
  <div class="pt-head">
    <h1>Prompt Timeline</h1>
    <div class="pt-date" id="ptDate"></div>
  </div>
  <div class="pt-stats" id="ptStats"></div>
  <div id="ptTimeline"></div>
  <div class="pt-foot" id="ptFoot"></div>
</div>
<script>window.PROMPT_TIMELINE_DATA = __DATA__;</script>
<script>__JS__</script>
<script>
(function () {
  var data = window.PROMPT_TIMELINE_DATA || {};
  var summary = data.summary || {};
  document.getElementById("ptDate").textContent = data.date || "";

  function stat(host, value, label) {
    var box = document.createElement("div");
    box.className = "pt-stat";
    var big = document.createElement("b");
    big.textContent = value;
    var small = document.createElement("span");
    small.textContent = label;
    box.appendChild(big);
    box.appendChild(small);
    host.appendChild(box);
  }

  var stats = document.getElementById("ptStats");
  var rows = data.human_prompts || [];
  stat(stats, summary.human_prompts != null ? summary.human_prompts : 0, "prompts typed");
  stat(stats, summary.slash_commands != null ? summary.slash_commands : 0, "slash commands");
  stat(stats, Object.keys(summary.by_session || {}).length, "sessions");
  if (rows.length) {
    stat(stats, rows[0].time.slice(0, 5) + " - " + rows[rows.length - 1].time.slice(0, 5), "first to last");
    var chars = rows.reduce(function (sum, r) { return sum + (r.chars || (r.text || "").length); }, 0);
    stat(stats, Math.round(chars / rows.length), "avg characters");
  }

  var host = document.getElementById("ptTimeline");
  PromptTimeline.mount(host, data);

  // Column width is derived from the space available, so redraw when that changes.
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { PromptTimeline.mount(host, data); }, 150);
  });

  var excluded = summary.excluded || {};
  var excludedText = Object.keys(excluded)
    .filter(function (key) { return excluded[key]; })
    .map(function (key) { return key + " " + excluded[key]; })
    .join(", ");
  document.getElementById("ptFoot").textContent =
    "Hover a dot for the prompt, click it for the full text. Click a header or a legend chip to hide that session." +
    (excludedText ? "  Machine-injected turns excluded: " + excludedText + "." : "") +
    (data.generatedAt ? "  Generated " + data.generatedAt : "");
})();
</script>
</body>
</html>
