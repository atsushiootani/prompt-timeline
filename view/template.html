<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>__TITLE__</title>
<style>__CSS__</style>
<script>
// The mascot is a ~55KB data URI, so it is carried once and reused from a custom
// property. Inlining it at each use site tripled the size of the page.
(function () {
  var icon = "__ICON__";
  if (!icon) return;
  document.documentElement.style.setProperty("--pt-mascot", 'url("' + icon + '")');
  var link = document.createElement("link");
  link.rel = "icon";
  link.href = icon;
  document.head.appendChild(link);
})();
</script>
</head>
<body>
<div class="pt-wrap">
  <div class="pt-head">
    <span class="pt-mascot" aria-hidden="true"></span>
    <h1>Prompt Timeline</h1>
    <div class="pt-date" id="ptDate"></div>
    <nav class="pt-days" id="ptDays" aria-label="Other days"></nav>
  </div>
  <section class="pt-hero" id="ptHero" aria-label="The day in numbers">
    <div class="pt-hero-text">
      <div class="pt-figs" id="ptFigs"></div>
      <p class="pt-lede" id="ptLede"></p>
      <p class="pt-facts" id="ptFacts"></p>
    </div>
    <div class="pt-hours" id="ptHours" aria-label="Hour by hour"></div>
  </section>
  <div id="ptTimeline"></div>
  <div class="pt-foot">
    <span class="pt-mark" aria-hidden="true"></span>
    <span id="ptFoot"></span>
  </div>
</div>
<script>window.PROMPT_TIMELINE_DATA = __DATA__;</script>
<script>__JS__</script>
<script>
(function () {
  var data = window.PROMPT_TIMELINE_DATA || {};
  var summary = data.summary || {};
  document.getElementById("ptDate").textContent = data.date || "";

  var rows = data.human_prompts || [];
  var sessions = Object.keys(summary.by_session || {}).length;
  var fmtUsd = function (v) { return "$" + v.toFixed(2); };
  var fmtTok = function (v) { return v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.round(v / 1e3) + "k"; };

  // 曜日も添える。日付は ISO より「何曜の自分か」で思い出すので。
  var weekday = function (d) { return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date(d + "T12:00:00Z").getUTCDay()]; };
  if (data.date) document.getElementById("ptDate").textContent = data.date + " · " + weekday(data.date);

  // 同じフォルダにある前後の日へ。無い側は押せない形で残す（位置が動かないように）。
  var days = data.days || {};
  var nav = document.getElementById("ptDays");
  [["prev", "‹ "], ["next", ""]].forEach(function (p) {
    var d = days[p[0]];
    var a = document.createElement(d ? "a" : "span");
    a.className = "pt-day" + (d ? "" : " off");
    if (d) { a.href = d + ".html"; a.title = d; }
    a.textContent = d ? (p[0] === "prev" ? "‹ " + weekday(d) + " " + d.slice(8) : weekday(d) + " " + d.slice(8) + " ›")
                      : (p[0] === "prev" ? "‹ earlier" : "later ›");
    nav.appendChild(a);
  });

  // 主役の数字は 3 つだけ。残りは下の一行に格を下げて残す（消さない）。
  // 前の日との差。増減に良し悪しの色は付けない（使った額が増えるのは失敗とは限らない）。
  var before = days.previous ? days.previous.summary : null;
  var vs = days.previous ? " vs " + weekday(days.previous.date) : "";
  function delta(cur, old, fmt) {
    if (!before || old == null) return "";
    var d = cur - old;
    if (Math.abs(d) < 1e-9) return "= same as" + vs.slice(3);
    return (d > 0 ? "▲ " : "▼ ") + fmt(Math.abs(d)) + vs;
  }
  function fig(value, label, diff) {
    var box = document.createElement("div");
    box.className = "pt-fig";
    var big = document.createElement("b");
    big.textContent = value;
    var small = document.createElement("span");
    small.textContent = label;
    box.appendChild(big);
    box.appendChild(small);
    if (diff) {
      var dd = document.createElement("em");
      dd.textContent = diff;
      box.appendChild(dd);
    }
    document.getElementById("ptFigs").appendChild(box);
  }
  var busy = summary.busy_ms ? PromptTimeline.formatDuration(summary.busy_ms) : null;
  if (summary.cost_usd) fig(fmtUsd(summary.cost_usd), "api-equivalent spend",
    delta(summary.cost_usd, before && before.cost_usd, fmtUsd));
  if (busy) fig(busy, "agents busy", delta(summary.busy_ms, before && before.busy_ms, PromptTimeline.formatDuration));
  fig(String(summary.human_prompts || 0), "prompts typed",
    delta(summary.human_prompts || 0, before && before.human_prompts, String));
  if (!summary.cost_usd) fig(String(sessions), "sessions");

  var facts = [];
  if (summary.tokens) facts.push(fmtTok(summary.tokens) + " tokens");
  facts.push(sessions + " sessions");
  facts.push((summary.slash_commands || 0) + " slash commands");
  if (rows.length) {
    var chars = rows.reduce(function (sum, r) { return sum + (r.chars || (r.text || "").length); }, 0);
    facts.push(Math.round(chars / rows.length) + " characters per prompt");
  }
  document.getElementById("ptFacts").textContent = facts.join("  ·  ");

  var host = document.getElementById("ptTimeline");
  // Sizing dots by cost is the point of the page when there is cost to show.
  var metric = summary.cost_usd ? "cost" : "none";
  var lede = document.getElementById("ptLede");
  function draw() {
    var drawn = PromptTimeline.mount(host, data, {
      metric: metric,
      onMetric: function (next) { metric = next; draw(); },
      hourlyHost: document.getElementById("ptHours"),
    });
    writeLede(drawn && drawn.colorOf || {});
  }

  // その日を一文で言い切る。何本・いつからいつまで・誰が一番使ったか。
  function writeLede(colorOf) {
    lede.textContent = "";
    if (!rows.length) return;
    var span = rows[0].time.slice(0, 5) + " to " + rows[rows.length - 1].time.slice(0, 5);
    var by = summary.cost_usd ? summary.cost_by_session : summary.busy_ms ? summary.busy_ms_by_session : summary.by_session;
    var total = summary.cost_usd || summary.busy_ms || summary.human_prompts || 0;
    var top = Object.entries(by || {}).sort(function (a, b) { return b[1] - a[1]; })[0];
    lede.appendChild(document.createTextNode(sessions + " session" + (sessions === 1 ? "" : "s") + " ran from " + span + ". "));
    if (!top) return;
    var who = document.createElement("span");
    who.className = "pt-who";
    var sw = document.createElement("i");
    sw.style.background = colorOf[top[0]] || "var(--sub)";
    who.appendChild(sw);
    var name = document.createElement("b");
    name.textContent = top[0].split(".").slice(1).join(".") || top[0];
    who.appendChild(name);
    lede.appendChild(who);
    var amount = summary.cost_usd ? fmtUsd(top[1]) : summary.busy_ms ? PromptTimeline.formatDuration(top[1]) : top[1] + " prompts";
    var verb = summary.cost_usd ? " spent the most" : summary.busy_ms ? " kept its agent busiest" : " took the most prompts";
    lede.appendChild(document.createTextNode(verb + " — " + amount + " (" + Math.round(top[1] / (total || 1) * 100) + "%)."));
  }
  draw();

  // Column width is derived from the space available, so redraw when that changes.
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(draw, 150);
  });

  var excluded = summary.excluded || {};
  var excludedText = Object.keys(excluded)
    .filter(function (key) { return excluded[key]; })
    .map(function (key) { return key + " " + excluded[key]; })
    .join(", ");
  document.getElementById("ptFoot").textContent =
    "Hover a dot for the prompt, click it (or a moment card) for the full text — Esc closes it. Click a session on the board or a column header to hide it." +
    (excludedText ? "  Machine-injected turns excluded: " + excludedText + "." : "") +
    (data.generatedAt ? "  Generated " + data.generatedAt : "");
})();
</script>
</body>
</html>
